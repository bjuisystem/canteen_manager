<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>企业餐厅点餐系统 - 管理后台</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
    <link rel="stylesheet" href="/component/pear/css/pear.css">
    <style>
        html, body, .pear-admin, .layui-layout { height: 100%; }
        .layui-side { height: 100%; background: #2f4056; }
        #sideMenu, .layui-side-scroll { height: 100%; background: #2f4056; }
        .layui-body { height: calc(100% - 60px); }
        .layui-logo { width: 200px; height: 60px; display: flex; align-items: center; overflow: hidden; }
        .layui-logo .title { margin-left: 8px; font-size: 16px; }
        .layui-logo img { width: 32px; height: 32px; object-fit: contain; }
        .layui-header { background: #23262e !important; }
        .layui-header .layui-nav-item > a { color: #fff !important; }
        .layui-header .layui-nav-item > a:hover { color: #fff !important; }
    </style>
</head>
<body class="pear-admin">
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo">
            <span class="title">企业餐厅点餐系统</span>
        </div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item">
                <a href="javascript:;">欢迎，<span th:text="${session.currUser.name}">用户</span></a>
            </li>
            <li class="layui-nav-item">
                <a href="javascript:;" id="logoutBtn">退出</a>
            </li>
        </ul>
    </div>
    <div class="layui-side">
        <div id="sideMenu"></div>
    </div>
    <div class="layui-body">
        <div id="content"></div>
    </div>
</div>

<script src="/component/layui/layui.js"></script>
<script src="/component/pear/pear.js"></script>
<script>
    layui.use(['admin', 'jquery'], function () {
        var admin = layui.admin;
        var $ = layui.jquery;
        admin.setConfigPath("/config/pear.config.yml");
        admin.render();

        $("#logoutBtn").on("click", function () {
            $.post("/login/logout", function () {
                window.location.href = "/login";
            });
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>食谱管理</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
</head>
<body class="layui-padding-16">

<div class="layui-form layui-form-pane" style="margin-bottom: 10px;">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">菜名</label>
            <div class="layui-input-inline">
                <input type="text" name="name" id="searchName" placeholder="请输入菜名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <button class="layui-btn" id="searchBtn">查询</button>
        <a class="layui-btn layui-btn-normal" href="/back/toRecipeAdd">新增菜品</a>
    </div>
</div>

<table id="recipeTable" lay-filter="recipeTable"></table>

<script type="text/html" id="recipeBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script src="/component/layui/layui.js"></script>
<script>
    layui.use(['table', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;

        table.render({
            elem: '#recipeTable',
            url: '/recipe/page',
            method: 'get',
            page: true,
            parseData: function (res) {
                return {
                    code: 0,
                    msg: res.msg,
                    count: res.data.total,
                    data: res.data.records
                };
            },
            cols: [
                [
                {field: 'recipeId', title: 'ID', width: 80},
                {field: 'name', title: '菜名'},
                {field: 'category', title: '分类'},
                {field: 'unit', title: '单位'},
                {field: 'price', title: '价格'},
                {field: 'picture', title: '图片', width: 120, templet: function (d) {
                    if (!d.picture) {
                        return '-';
                    }
                    return "<img src='/picture/" + d.picture + "' style='width:60px;height:40px;object-fit:cover;border-radius:4px;'>";
                }},
                {title: '操作', toolbar: '#recipeBar', width: 120}
            ]
            ]
        });

        table.on('tool(recipeTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                window.location.href = '/back/toRecipeEdit/' + data.recipeId;
            } else if (obj.event === 'del') {
                layer.confirm('确认删除该菜品？', function (index) {
                    layui.$.ajax({
                        url: '/recipe/delete/' + data.recipeId,
                        type: 'DELETE',
                        success: function (res) {
                            if (res.code === 200) {
                                obj.del();
                                layer.msg('删除成功');
                            } else {
                                layer.msg(res.msg || '删除失败');
                            }
                        }
                    });
                    layer.close(index);
                });
            }
        });

        layui.$('#searchBtn').on('click', function () {
            table.reload('recipeTable', {
                where: { name: layui.$('#searchName').val() },
                page: { curr: 1 }
            });
        });
    });
</script>
<script>
    (function () {
        var btn = document.getElementById('logoutBtn');
        if (!btn) { return; }
        btn.addEventListener('click', function () {
            fetch('/login/logout', {method: 'POST'}).finally(function () {
                window.location.href = '/login';
            });
        });
    })();
</script>
</body>
</html>

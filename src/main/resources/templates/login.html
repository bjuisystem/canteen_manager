<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>企业餐厅点餐系统 - 登录</title>
    <link rel="stylesheet" href="/frontStatic/css/bootstrap.min.css">
    <link rel="stylesheet" href="/frontStatic/css/login.css">
    <link rel="stylesheet" href="/frontStatic/css/sweetalert.css">
    <style>
        body { background: #f5f7fb; }
        .login-box {
            max-width: 340px;
            margin: 6% auto 0;
            padding: 20px 22px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        .login-title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }
        .captcha-row { display: flex; gap: 10px; align-items: center; }
        .captcha-row img { height: 40px; cursor: pointer; border: 1px solid #ddd; border-radius: 4px; }
        .btn-primary { width: 100%; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-title">企业餐厅点餐系统</div>
    <div class="form-group">
        <label>登录名</label>
        <input type="text" class="form-control" id="username" placeholder="请输入登录名">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-control" id="password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary" id="loginBtn">登录</button>
</div>

<script src="/frontStatic/js/jquery-1.11.2.min.js"></script>
<script src="/frontStatic/js/sweetalert.min.js"></script>
<script>
    function doLogin() {
        var data = {
            username: $("#username").val(),
            password: $("#password").val()
        };
        $.ajax({
            url: "/login/userLogin",
            type: "POST",
            data: data,
            success: function (res) {
                if (res.code === 200) {
                    $.get("/user/getInfo", function (info) {
                        if (info && info.data && info.data.role === "staff") {
                            window.location.href = "/front/toMain";
                        } else {
                            window.location.href = "/back/toIndex";
                        }
                    });
                } else {
                    swal(res.msg || "登录失败");
                }
            },
            error: function () {
                swal("登录失败");
            }
        });
    }

    $("#loginBtn").on("click", doLogin);
    $(document).on("keydown", function (e) {
        if (e.keyCode === 13) {
            doLogin();
        }
    });
</script>
</body>
</html>

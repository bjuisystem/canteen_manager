<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>厨房主管 - 今日汇总</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
</head>
<body class="layui-padding-16">


<div style="margin-bottom: 10px;">
    <button class="layui-btn" id="printChefBtn">打印总括订单</button>
</div>

<table id="chefTable" lay-filter="chefTable"></table>

<script src="/component/layui/layui.js"></script>
<script>
    layui.use(['table', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;

        table.render({
            elem: '#chefTable',
            url: '/order/pageChef',
            method: 'get',
            page: true,
            parseData: function (res) {
                return {
                    code: 0,
                    msg: res.msg,
                    count: res.data.total,
                    data: res.data.records
                };
            },
            cols: [
                [
                {type: 'checkbox'},
                {field: 'name', title: '菜名'},
                {field: 'unit', title: '单位'},
                {field: 'weight', title: '总分量'},
                {field: 'totalPrice', title: '总金额'}
            ]
            ]
        });

        layui.$('#printChefBtn').on('click', function () {
            var checkStatus = table.checkStatus('chefTable');
            if (checkStatus.data.length === 0) {
                layer.msg('请选择要打印的菜品');
                return;
            }
            var names = checkStatus.data.map(function (row) { return row.name; }).join(',');
            window.location.href = '/order/printChef/' + names;
        });
    });
</script>
<script>
    (function () {
        var btn = document.getElementById('logoutBtn');
        if (!btn) { return; }
        btn.addEventListener('click', function () {
            fetch('/login/logout', {method: 'POST'}).finally(function () {
                window.location.href = '/login';
            });
        });
    })();
</script>
</body>
</html>

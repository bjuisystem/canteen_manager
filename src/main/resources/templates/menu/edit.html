<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑菜单</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
</head>
<body class="layui-padding-16">


<div style="margin-bottom: 10px;">
    <a class="layui-btn layui-btn-primary" href="javascript:history.back()">返回</a>
</div>
<form class="layui-form" lay-filter="menuForm">
    <div class="layui-form-item">
        <label class="layui-form-label">菜名</label>
        <div class="layui-input-block">
            <input type="text" name="name" required lay-verify="required" th:value="${session.editMenu.name}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">分类</label>
        <div class="layui-input-block">
            <input type="text" name="category" required lay-verify="required" th:value="${session.editMenu.category}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">单位</label>
        <div class="layui-input-block">
            <input type="text" name="unit" required lay-verify="required" th:value="${session.editMenu.unit}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">价格</label>
        <div class="layui-input-block">
            <input type="number" name="price" required lay-verify="required" th:value="${session.editMenu.price}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">图片</label>
        <div class="layui-input-block">
            <button type="button" class="layui-btn" id="uploadBtn">上传图片</button>
            <input type="hidden" name="picture" id="picture" th:value="${session.editMenu.picture}">
            <div id="preview" style="margin-top: 10px;">
                <img th:if="${session.editMenu.picture != null}" th:src="@{/picture/{file}(file=${session.editMenu.picture})}" style="max-width:200px;">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit lay-filter="saveMenu">保存</button>
        </div>
    </div>
</form>

<script src="/component/layui/layui.js"></script>
<script>
    layui.use(['form', 'layer', 'upload'], function () {
        var form = layui.form;
        var layer = layui.layer;
        var upload = layui.upload;

        upload.render({
            elem: '#uploadBtn',
            url: '/common/upload',
            done: function (res) {
                if (res.code === 200) {
                    layui.$('#picture').val(res.data);
                    layui.$('#preview').html('<img src="/picture/' + res.data + '" style="max-width:200px;">');
                } else {
                    layer.msg(res.msg || '上传失败');
                }
            }
        });

        form.on('submit(saveMenu)', function (data) {
            layui.$.ajax({
                url: '/menu/update',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data.field),
                success: function (res) {
                    if (res.code === 200) {
                        layer.msg('更新成功', {time: 1200}, function () {
                            window.location.href = '/back/toMenu';
                        });
                    } else {
                        layer.msg(res.msg || '更新失败');
                    }
                }
            });
            return false;
        });
    });
</script>
<script>
    (function () {
        var btn = document.getElementById('logoutBtn');
        if (!btn) { return; }
        btn.addEventListener('click', function () {
            fetch('/login/logout', {method: 'POST'}).finally(function () {
                window.location.href = '/login';
            });
        });
    })();
</script>
</body>
</html>

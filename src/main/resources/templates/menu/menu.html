<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本周菜单</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
</head>
<body class="layui-padding-16">


<div class="layui-form layui-form-pane" style="margin-bottom: 10px;">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">菜名</label>
            <div class="layui-input-inline">
                <input type="text" name="name" id="searchName" placeholder="请输入菜名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <button class="layui-btn" id="searchBtn">查询</button>
        <a class="layui-btn layui-btn-normal" href="/back/toAddMenu">新增菜单</a>
        <button class="layui-btn layui-btn-normal" id="multiplexBtn">复用到下周</button>
    </div>
</div>

<table id="menuTable" lay-filter="menuTable"></table>

<script type="text/html" id="menuBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script src="/component/layui/layui.js"></script>
<script>
    layui.use(['table', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;

        table.render({
            elem: '#menuTable',
            url: '/menu/pageThisWeek',
            method: 'get',
            page: true,
            parseData: function (res) {
                return {
                    code: 0,
                    msg: res.msg,
                    count: res.data.total,
                    data: res.data.records
                };
            },
            cols: [
                [
                {type: 'checkbox'},
                {field: 'menuId', title: 'ID', width: 80},
                {field: 'name', title: '菜名'},
                {field: 'category', title: '分类'},
                {field: 'unit', title: '单位'},
                {field: 'price', title: '价格'},
                {title: '操作', toolbar: '#menuBar', width: 120}
            ]
            ]
        });

        table.on('tool(menuTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                window.location.href = '/back/toMenuEdit/' + data.menuId;
            } else if (obj.event === 'del') {
                layer.confirm('确认删除该菜单项？', function (index) {
                    layui.$.ajax({
                        url: '/menu/delete/' + data.menuId,
                        type: 'DELETE',
                        success: function (res) {
                            if (res.code === 200) {
                                obj.del();
                                layer.msg('删除成功');
                            } else {
                                layer.msg(res.msg || '删除失败');
                            }
                        }
                    });
                    layer.close(index);
                });
            }
        });

        layui.$('#searchBtn').on('click', function () {
            table.reload('menuTable', {
                where: { name: layui.$('#searchName').val() },
                page: { curr: 1 }
            });
        });

        layui.$('#multiplexBtn').on('click', function () {
            var checkStatus = table.checkStatus('menuTable');
            if (checkStatus.data.length === 0) {
                layer.msg('请选择要复用的菜单');
                return;
            }
            var ids = checkStatus.data.map(function (row) { return row.menuId; }).join(',');
            layui.$.ajax({
                url: '/menu/multiplex/' + ids,
                type: 'POST',
                success: function (res) {
                    if (res.code === 200) {
                        layer.msg(res.data || '复用成功');
                    } else {
                        layer.msg(res.msg || '复用失败');
                    }
                }
            });
        });
    });
</script>
<script>
    (function () {
        var btn = document.getElementById('logoutBtn');
        if (!btn) { return; }
        btn.addEventListener('click', function () {
            fetch('/login/logout', {method: 'POST'}).finally(function () {
                window.location.href = '/login';
            });
        });
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>菜品详情</title>
    <link rel="stylesheet" href="/frontStatic/css/bootstrap.min.css">
    <link rel="stylesheet" href="/frontStatic/css/shopdetail.css">
    <link rel="stylesheet" href="/frontStatic/css/sweetalert.css">
    <style>
        .detail-wrap { margin-top: 20px; }
        .detail-img { width: 100%; height: 320px; object-fit: cover; border-radius: 6px; }
        .detail-info { margin-top: 10px; }
        .detail-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container detail-wrap">
    <a href="/front/toMain" class="btn btn-link">返回菜单</a>
    <div class="row">
        <div class="col-md-6">
            <img class="detail-img" th:src="@{/picture/{file}(file=${menuDetail.picture})}" alt="菜品图片">
        </div>
        <div class="col-md-6 detail-info">
            <div class="detail-title" th:text="${menuDetail.name}">菜品名</div>
            <p>分类：<span th:text="${menuDetail.category}">分类</span></p>
            <p>单位：<span th:text="${menuDetail.unit}">单位</span></p>
            <p>价格：￥<span id="price" th:text="${menuDetail.price}">0</span></p>
            <div class="form-inline">
                <label>分量：</label>
                <input type="number" id="weight" class="form-control" value="1" min="1">
                <button class="btn btn-primary" id="addCartBtn"
                        th:attr="data-menu-id=${menuId},data-menu-name=${menuDetail.name},data-menu-unit=${menuDetail.unit},data-menu-price=${menuDetail.price},data-menu-picture=${menuDetail.picture}">
                    加入购物车
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/frontStatic/js/jquery-1.11.2.min.js"></script>
<script src="/frontStatic/js/sweetalert.min.js"></script>
<script>
    $("#addCartBtn").on("click", function () {
        var btn = this;
        var menuId = btn.dataset.menuId;
        if (!menuId || menuId < 0) {
            swal("菜品信息丢失，请返回菜单重新进入");
            return;
        }
        var weight = parseInt($("#weight").val(), 10);
        if (!weight || weight <= 0) {
            swal("请输入有效分量");
            return;
        }
        var data = {
            menuId: menuId,
            name: btn.dataset.menuName || "",
            unit: btn.dataset.menuUnit || "",
            price: parseFloat(btn.dataset.menuPrice || "0"),
            weight: weight,
            picture: btn.dataset.menuPicture || ""
        };
        $.ajax({
            url: "/shopCart/add",
            type: "POST",
            data: JSON.stringify(data),
            contentType: "application/json",
            success: function (res) {
                if (res.code === 200) {
                    swal(res.data || "加入成功");
                } else {
                    swal(res.msg || "加入失败");
                }
            },
            error: function () {
                swal("加入失败");
            }
        });
    });
</script>
</body>
</html>

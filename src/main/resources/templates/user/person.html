<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人信息</title>
    <link rel="stylesheet" href="/component/layui/css/layui.css">
</head>
<body class="layui-padding-16">


<table class="layui-table">
    <tbody>
    <tr>
        <th>姓名</th>
        <td th:text="${session.currUser.name}">-</td>
        <th>登录名</th>
        <td th:text="${session.currUser.username}">-</td>
    </tr>
    <tr>
        <th>联系电话</th>
        <td th:text="${session.currUser.telephone}">-</td>
        <th>部门</th>
        <td th:text="${session.currUser.department}">-</td>
    </tr>
    <tr>
        <th>工位信息</th>
        <td th:text="${session.currUser.workStation}">-</td>
        <th>角色</th>
        <td th:text="${session.currUser.role}">-</td>
    </tr>
    </tbody>
</table>

<a class="layui-btn" href="/back/toUpdatePwd">修改密码</a>
<script>
    (function () {
        var btn = document.getElementById('logoutBtn');
        if (!btn) { return; }
        btn.addEventListener('click', function () {
            fetch('/login/logout', {method: 'POST'}).finally(function () {
                window.location.href = '/login';
            });
        });
    })();
</script>
</body>
</html>
